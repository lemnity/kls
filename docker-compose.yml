services:
  postgres:
    image: postgres@sha256:93d55776e04376e19adb2733e3ccebb4392ee7dd86d8ff238503b30fe719c84f
    environment:
      POSTGRES_DB: europa
      POSTGRES_USER: europa
      POSTGRES_PASSWORD: europa_local_only
    ports:
      - '${EUROPA_POSTGRES_PORT:-5434}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U europa -d europa']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
    ports:
      - '${EUROPA_REDIS_PORT:-6380}:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    environment:
      MINIO_ROOT_USER: europa_minio
      MINIO_ROOT_PASSWORD: europa_minio_local_only
    ports:
      - '${EUROPA_MINIO_PORT:-9002}:9000'
      - '${EUROPA_MINIO_CONSOLE_PORT:-9003}:9001'
    command: ['server', '/data', '--console-address', ':9001']
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --silent http://localhost:9000/minio/health/ready']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  minio_data:
  postgres_data:
  redis_data:
